name: Build Windows Driver

on:
  workflow_dispatch:
  push:
    branches: [ master, ivymsr-driver ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, Win32]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore src\WinMSRDriver\MSR.vcxproj

      - name: Build
        run: msbuild src\WinMSRDriver\MSR.vcxproj /m /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          $dest = "driver-artifact\${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Path "src\WinMSRDriver" -Recurse -File |
            Where-Object { $_.Name -match '^msr\.(sys|pdb|inf|cat)$' } |
            Copy-Item -Destination $dest
          Write-Host "Collected files:"
          Get-ChildItem -Path $dest -File

      - name: upload-artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: WinMSRDriver-${{ matrix.platform }}
          path: driver-artifact\${{ matrix.platform }}\*
